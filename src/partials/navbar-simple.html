<nav
  class="bg-gray-800 border-b border-gray-700 sticky top-0 z-30"
  data-simple-nav="true"
>
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <!-- Left side: Brand Logo & Title -->
      <div class="flex items-center space-x-3">
        <div class="flex-shrink-0 flex items-center cursor-pointer">
          <a href="{{baseUrl}}" class="flex items-center">
            <img
              id="nav-logo"
              src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
              alt="{{#if brandName}}{{brandName}}{{else}}Bento PDF{{/if}} Logo"
              class="h-8 w-8"
            />
            <span id="nav-brand" class="text-white font-bold text-xl ml-2">
              {{#if brandName}}{{brandName}}{{else}}BentoPDF{{/if}}
            </span>
          </a>
        </div>
      </div>

      <!-- Right side: Navigation actions & Language Selector -->
      <div class="flex items-center space-x-3">
        <!-- Back to Tools Button (Auto-hidden on homepage, visible on all tool subpages) -->
        <a
          href="{{baseUrl}}"
          id="nav-back-button"
          class="hidden items-center gap-1.5 px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-indigo-300 hover:text-white rounded-lg text-sm font-semibold transition-colors cursor-pointer shadow-sm border border-gray-600/50"
          title="返回工具列表 (Cmd+[)"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          <span data-i18n="tools.backToTools">返回工具</span>
        </a>

        <div id="simple-nav-lang-switcher" class="relative"></div>
      </div>
    </div>
  </div>
</nav>

<style>
  /* 桌面與簡易模式下隱藏頁面內部重複的返回按鈕，統一由右上角導覽列返回 */
  #back-to-tools,
  [id^="back-to-tools"],
  button:has([data-i18n="tools.backToTools"]) {
    display: none !important;
  }
</style>

<script>
  (function () {
    try {
      function checkBackButton() {
        var p = window.location.pathname;
        var backBtn = document.getElementById('nav-back-button');
        if (backBtn) {
          var isHome =
            p === '/' ||
            p === '' ||
            p.endsWith('/index.html') ||
            p.endsWith('/simple-index.html');
          if (!isHome) {
            backBtn.classList.remove('hidden');
            backBtn.classList.add('flex');
          } else {
            backBtn.classList.add('hidden');
            backBtn.classList.remove('flex');
          }
        }
      }
      checkBackButton();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkBackButton);
      }

      // Keyboard shortcut: Cmd + [ or Alt + Left to navigate back
      window.addEventListener('keydown', function (e) {
        if (
          ((e.metaKey || e.ctrlKey) && e.key === '[') ||
          (e.altKey && e.key === 'ArrowLeft')
        ) {
          var p = window.location.pathname;
          var isHome =
            p === '/' ||
            p === '' ||
            p.endsWith('/index.html') ||
            p.endsWith('/simple-index.html');
          if (!isHome) {
            window.location.href = '{{baseUrl}}';
          }
        }
      });
    } catch (e) {}
  })();
</script>
