[package]
name = "bentopdf"
version = "2.8.10"
description = "BentoPDF Desktop Application"
authors = ["BentoPDF Contributors"]
edition = "2021"

[lib]
name = "bentopdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
